name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Restore cached CI debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: shayari-ci-debug-keystore-v1

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
          elif [ -s debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore optional Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '^[[:space:]]*{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n' | base64 -d > app/google-services.json
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk "Shayari-App-v1.2-b${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shayari-App-APK-b${{ github.run_number }}
          path: Shayari-App-v1.2-b${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-b${{ github.run_number }}
          name: "शायरी (Shayari) App v1.2 — Build #${{ github.run_number }}"
          body: |
            ### 📱 नया अपडेट (v1.2) अपने Android फ़ोन में इंस्टॉल करें
            1. अगर फ़ोन में पहले से पुराना ऐप है और Update न हो, तो **एक बार पुराना ऐप Uninstall करें**।
            2. नीचे **Shayari-App-v1.2-b${{ github.run_number }}.apk** पर टैप करके डाउनलोड करें।
            3. डाउनलोड पूरा होने पर फ़ाइल खोलें और **Install** पर टैप करें।
          files: Shayari-App-v1.2-b${{ github.run_number }}.apk
          overwrite_files: true
          make_latest: true
