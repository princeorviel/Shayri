name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Prepare debug keystore
        run: |
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk Shayari-App.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shayari-App-APK
          path: Shayari-App.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "शायरी (Shayari) Android App — Latest APK"
          body: |
            ### 📱 अपने Android फ़ोन में इंस्टॉल करें
            1. नीचे **Shayari-App.apk** पर टैप करके डाउनलोड करें।
            2. डाउनलोड पूरा होने पर फ़ाइल खोलें और **Install** पर टैप करें।
            3. यदि *Install unknown apps* की अनुमति मांगे, तो **Allow** करें।
          files: Shayari-App.apk
          overwrite_files: true
          make_latest: true
